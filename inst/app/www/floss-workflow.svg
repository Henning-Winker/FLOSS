<rect x="392" y="360" width="200" height="96" rx="10" fill="#eaf2f6" stroke="#b9c3cc"/>
<text text-anchor="middle" font-size="16" fill="#1d2733"><tspan x="492" y="392.0" font-weight="700">2 Species</tspan><tspan x="492" y="413.0">biology, selectivity,</tspan><tspan x="492" y="434.0">and catchability</tspan></text>
<rect x="688" y="360" width="200" height="96" rx="10" fill="#eaf2f6" stroke="#b9c3cc"/>
