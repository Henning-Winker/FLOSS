<text x="844" y="512" text-anchor="middle" font-size="13" fill="#4a5866">answer key</text>
<text x="96" y="700" font-size="14" fill="#4a5866">Solid arrows: the path through the app. Dashed arrows: settings or results one step borrows from another. Dashed box: shown only when Hide truth is unticked.</text>
