<rect x="1022" y="451" width="200" height="96" rx="10" fill="#eaf2f6" stroke="#b9c3cc"/>
<text text-anchor="middle" font-size="16" fill="#1d2733"><tspan x="1122" y="493.5" font-weight="700">4 Sampling</tspan><tspan x="1122" y="514.5">observer data, with errors</tspan></text>
<rect x="1318" y="451" width="200" height="96" rx="10" fill="#eaf2f6" stroke="#b9c3cc"/>
<text text-anchor="middle" font-size="16" fill="#1d2733"><tspan x="1418" y="493.5" font-weight="700">6 Export</tspan><tspan x="1418" y="514.5">datasets to download</tspan></text>
<rect x="688" y="560" width="200" height="96" rx="10" fill="#f2f2f2" stroke="#8a96a3" stroke-dasharray="6 4"/>
<text text-anchor="middle" font-size="16" fill="#1d2733"><tspan x="788" y="602.5" font-weight="700">7 True status</tspan><tspan x="788" y="623.5">answer key, for trainers</tspan></text>
<rect x="1022" y="265" width="496" height="104" rx="10" fill="#fdf1e2" stroke="#e2b77a"/>
<text text-anchor="middle" font-size="16" fill="#1d2733"><tspan x="1270" y="301.0" font-weight="700">5 Treatments (optional)</tspan><tspan x="1270" y="322.0">Build, Predict, and Reveal</tspan><tspan x="1270" y="343.0">up to 4 saved changes, compared within the app, not exported</tspan></text>
<text x="988" y="302" text-anchor="middle" font-size="13" fill="#4a5866">optional</text>
