<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 250 1460 470" width="1460" height="470" role="img" aria-label="How the FLOSS steps connect: 1 Fishery, 2 Species, and 3 Operating model lead to 4 Sampling and 6 Export; 5 Treatments is an optional branch from the operating model that uses the sampling settings; 7 True status shows the answer key." font-family="'Times New Roman', Times, serif">
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#5b6b7a"/></marker></defs>
<rect x="80" y="250" width="1460" height="470" fill="#ffffff"/>
